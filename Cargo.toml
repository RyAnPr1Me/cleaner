[package]
name = "cleaner"
version = "0.1.0"
edition = "2021"
authors = ["RyAnPr1Me"]
description = "A universal Rust-based computer performance improver"
license = "MIT"
repository = "https://github.com/RyAnPr1Me/cleaner"

[dependencies]
sysinfo = "0.30"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
indicatif = "0.17"
walkdir = "2.5"
humansize = "2.1"
chrono = "0.4"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
